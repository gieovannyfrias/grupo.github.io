    <style>
        :root {
            /* Colores de Alta Fidelidad (Estilo Cyberpunk-Minimal) */
            --bg: #030303;                  /* Negro absoluto */
            --grid-line: #161616;           /* Líneas de cuadrícula sutiles */
            --accent: #00ff66;              /* Verde matriz/tecnológico puro */
            --accent-dim: rgba(0, 255, 102, 0.15);
            --border: #222222;              /* Borde industrial fino */
            --text-primary: #ffffff;
            --text-secondary: #7f7f7f;     /* Gris minimalista */
            
            --font-mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            
            /* Fondo de rejilla digital matemática */
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
          zoom:75%;
        }

        /* Contenedor asimétrico estilo Bento */
        .bento-grid {
            max-width: 700px;
            width: 100%;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            box-sizing: border-box;
        }

        /* Bloque base del Bento */
        .bento-card {
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Distribución asimétrica de los bloques */
        .card-main {
            grid-column: span 3;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        /* Detalle de iluminación en la tarjeta principal */
        .card-main::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 150px; height: 150px;
            background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
            pointer-events: none;
        }

        .card-link {
            grid-column: span 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            min-height: 100px;
        }

        .card-link:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-dim);
            transform: translateY(-2px);
        }

        .card-footer {
            grid-column: span 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }

        /* Elementos de Texto */
        .status-badge {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: blink 1.5s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: -1px;
        }

        p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 0;
        }

        /* Estilos de la red de enlaces bento */
        .link-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .link-url {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 20px;
        }

        /* Botón de acción minimalista */
        .btn-action {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 15px var(--accent);
        }

        /* Adaptabilidad para móviles */
        @media (max-width: 600px) {
            .card-link { grid-column: span 3; }
            .card-footer { flex-direction: column; gap: 16px; text-align: center; }
        }
    </style>
</body>
