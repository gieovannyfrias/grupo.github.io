<div class="section_0">
  <!-- Contenedor Principal del Formulario -->

    <div class="form-header">
      <h2>Contacto Corporativo</h2>

<form id="groupContactForm" action="https://formspree.io/f/mbgjqzvy" method="POST">
  <div class="input-group">
    <label for="nombre">Nombre Completo</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej. Alexander Wright" required>
  </div>
  
  <div class="input-group">
    <label for="correo">Correo Electrónico</label>
    <input type="email" id="correo" name="correo" placeholder="nombre@empresa.com" required>
  </div>
  
  <div class="input-group">
    <label for="marca">Marca o Departamento</label>
    <div class="select-wrapper">
      <select id="marca" name="marca" required>
        <option value="" disabled selected>Selecciona una opción</option>
        <option value="Noticnacinter">Noticnacinter</option>
        <option value="Pirdeoc">Pirdeoc</option>
        <option value="Gieovanny Frias">Gieovanny Frias</option>
        <option value="Otro">Otro</option>
      </select>
    </div>
  </div>
  
  <div class="input-group">
    <label for="mensaje">Detalle de la Solicitud</label>
    <textarea id="mensaje" name="mensaje" placeholder="Escribe los detalles aquí..." required></textarea>
  </div>

  <!-- BOTÓN CORREGIDO: Sin etiquetas span adentro -->
  <button type="submit" class="submit-btn">Enviar Mensaje</button>
</form>

  </div>

  <!-- Nueva sección de Soporte Extra -->

  <style>
    /* --- VARIABLES PREMIUM --- */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1; /* Morado/Índigo eléctrico */
      --accent-hover: #4f46e5;
      --input-bg: rgba(15, 23, 42, 0.6);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- RESET GENERAL --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-gradient);
     zoom:75%;
    }
 .section_0 {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
  color: var(--text-main);
  gap: 24px;
  padding-top: 100px;
}

.form-container, .support-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  width: 100%;
  max-width: 480px;
  padding: 40px;
  border-radius: var(--radius);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

.form-header {
  text-align: center;
  margin-bottom: 32px;
}

.form-header h2 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
  background: linear-gradient(to right, #fff, var(--text-muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.form-header p {
  color: var(--text-muted);
  font-size: 14px;
}

.input-group {
  margin-bottom: 24px;
}

.input-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.input-group input,
.input-group textarea,
.input-group select {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 14px 16px;
  color: var(--text-main);
  font-size: 15px;
  outline: none;
  transition: var(--transition);
  appearance: none;
}

.select-wrapper {
  position: relative;
}

.select-wrapper::after {
  content: '↓';
  font-size: 12px;
  color: var(--text-muted);
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
}

.input-group select option {
  background: #1e293b;
  color: var(--text-main);
}

.input-group textarea {
  resize: none;
  min-height: 100px;
}

.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  background: rgba(15, 23, 42, 0.8);
}

.submit-btn {
  width: 100%;
  background: var(--accent);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.submit-btn:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
}

.support-card {
  border-left: 4px solid var(--accent);
  padding: 24px 32px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.support-card h3 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.support-card p {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.5;
}

  <script src="src/components/Header-Footer/Header-Footer-main.js" defer></script>
  <script>
const formGrupo = document.getElementById("groupContactForm");

if (formGrupo) {
  formGrupo.addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const btn = formGrupo.querySelector(".submit-btn");
    const textoOriginal = btn.textContent || "Enviar Mensaje";

    btn.style.pointerEvents = "none";
    btn.textContent = "Procesando...";

    try {
      const res = await fetch(formGrupo.action, {
        method: formGrupo.method,
        body: new FormData(formGrupo),
        headers: { 'Accept': 'application/json' }
      });
      
      if (res.ok) {
        btn.style.background = "#28a745";
        btn.textContent = "¡Solicitud Recibida! ✓";
        
        setTimeout(() => {
          formGrupo.reset();
          btn.style.background = "";
          btn.textContent = textoOriginal;
          btn.style.pointerEvents = "auto";
        }, 2000);
      } else { 
        throw new Error(); 
      }
    } catch (err) {
      btn.style.background = "#dc3545";
      btn.textContent = "Error al enviar ✗";
      
      setTimeout(() => {
        btn.style.background = "";
        btn.textContent = textoOriginal;
        btn.style.pointerEvents = "auto";
      }, 3000);
    }
  });
}

  </script>
