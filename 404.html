    <div class="container">
        <div class="error-code">404</div>

    <style>
:root {
    /* Paleta de colores Premium */
    --bg-gradient-start: #0a0e17; /* Azul noche ultra profundo */
    --bg-gradient-end: #030508;   /* Negro puro */
    --card-bg: rgba(255, 255, 255, 0.03); /* Fondo translúcido tipo Glassmorphism */
    --card-border: rgba(255, 255, 255, 0.07);
    
    /* Colores de acento e iluminación */
    --primary-color: #00f2fe;     /* Cian eléctrico premium */
    --secondary-color: #4facfe;   /* Azul tecnológico brillante */
    --text-main: #ffffff;         /* Blanco puro para contrastes altos */
    --text-muted: #8fa0dd;        /* Azul grisáceo para textos secundarios */
    
    /* Variables corregidas para consistencia del modo premium */
    --card-bg-hover: rgba(255, 255, 255, 0.08);
    --card-border-hover: rgba(0, 242, 254, 0.3);
    --btn-bg: #ffffff;            /* Fondo del botón principal */
    --btn-text: #030508;          /* Texto del botón principal */
}

body {
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-main);
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    
    /* Fondo premium con degradado radial */
    background: radial-gradient(circle at center, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
    background-attachment: fixed;
    
    /* Suavizado de tipografía para pantallas retina */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  zoom:75%;
}

.container {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 50px 40px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    max-width: 600px;
    width: 100%;
    box-sizing: border-box;
}

.error-code {
    font-size: 120px;
    font-weight: 900;
    margin: 0;
    /* Se cambió a degradado premium en el texto */
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
}

h1 {
    font-size: 28px;
    margin-top: 10px;
    margin-bottom: 20px;
}

p {
    font-size: 16px;
    color: var(--text-muted); /* Corregido: antes tenía un gris oscuro invisible (#666) */
    line-height: 1.6;
    margin-bottom: 30px;
}

.network-title {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: bold;
    color: var(--primary-color); /* Corregido: armoniza con la identidad de marca */
    margin-bottom: 15px;
}

.grid-sites {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    margin-bottom: 40px;
}

.site-link {
    display: block;
    padding: 14px;
    background: var(--card-bg); /* Corregido: antes era blanco sólido plano */
    border: 1px solid var(--card-border); /* Corregido: antes era un borde gris claro */
    border-radius: 12px;
    text-decoration: none;
    color: var(--text-main); /* Corregido: antes usaba --dark-color inexistente */
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.site-link:hover {
    border-color: var(--card-border-hover);
    background-color: var(--card-bg-hover);
    transform: translateY(-3px);
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.15); /* Resplandor neón sutil */
}

.btn-home {
    display: inline-block;
    padding: 14px 35px;
    background-color: var(--btn-bg); /* Corregido: usa fondo claro para un contraste premium alto */
    color: var(--btn-text);
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
}

.btn-home:hover {
    background-color: var(--primary-color);
    color: var(--btn-text);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
}
